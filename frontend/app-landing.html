<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>teqlif</title>
  <style>
    :root {
      --bg:        #edfaf9;
      --bg-glow:   #c8f1ed;
      --g1:        #0f766e;
      --g2:        #0891b2;
      --g3:        #06b6d4;
      --g4:        #0891b2;
      --g5:        #0f766e;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:      #05100f;
        --bg-glow: #0b1e1c;
        --g1:      #2dd4bf;
        --g2:      #06b6d4;
        --g3:      #7dd3fc;
        --g4:      #06b6d4;
        --g5:      #2dd4bf;
      }
    }

    :root[data-theme="dark"] {
      --bg:      #05100f;
      --bg-glow: #0b1e1c;
      --g1:      #2dd4bf;
      --g2:      #06b6d4;
      --g3:      #7dd3fc;
      --g4:      #06b6d4;
      --g5:      #2dd4bf;
    }

    :root[data-theme="light"] {
      --bg:      #edfaf9;
      --bg-glow: #c8f1ed;
      --g1:      #0f766e;
      --g2:      #0891b2;
      --g3:      #06b6d4;
      --g4:      #0891b2;
      --g5:      #0f766e;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(ellipse 75% 55% at 50% 50%, var(--bg-glow) 0%, var(--bg) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wordmark {
      font-family: system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
      font-size: clamp(3.5rem, 13vw, 11rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      background: linear-gradient(
        90deg,
        var(--g1),
        var(--g2),
        var(--g3),
        var(--g4),
        var(--g5)
      );
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation:
        flow   10s linear                    infinite,
        appear  0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      user-select: none;
    }

    @keyframes flow {
      from { background-position:   0% center; }
      to   { background-position: 300% center; }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    @media (prefers-reduced-motion: reduce) {
      .wordmark {
        animation: appear 0.2s ease both;
        background-position: 50% center;
      }
    }
  </style>
</head>
<body>
  <span class="wordmark">teqlif</span>
</body>
</html>
