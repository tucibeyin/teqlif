# /etc/prometheus/prometheus.yml
# Monolith kurulum — tüm servisler localhost

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'livekit'
    static_configs:
      - targets: ['localhost:7881']

  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']
