# /etc/promtail-config.yml
# Monolith kurulum — Loki localhost:3100

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  - job_name: teqlif-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: teqlif-backend
          __path__: /var/log/teqlif/*.log

  - job_name: teqlif-errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: teqlif-errors
          __path__: /var/log/teqlif/error*.log

  - job_name: nginx-access
    pipeline_stages:
      - regex:
          expression: '(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<request>[^"]+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]+)" "(?P<http_user_agent>[^"]+)"'
      - geoip:
          db: /usr/share/GeoIP/GeoLite2-City.mmdb
          source: remote_addr
          db_type: city
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-access
          __path__: /var/log/nginx/access.log

  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          __path__: /var/log/nginx/error.log

  - job_name: systemd-journal
    journal:
      max_age: 12h
      labels:
        job: systemd-journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: unit

  - job_name: teqlif-worker-log
    static_configs:
      - targets:
          - localhost
        labels:
          job: teqlif-worker
          __path__: /var/log/teqlif/worker*.log
