# PostgreSQL tuning — node1 (OVH Paris, 11.4 GB RAM, 6 core, NVMe)
# Uygulandı: 2026-09-10
# Uygulama: ALTER SYSTEM — aktif değerler /etc/postgresql/17/main/postgresql.auto.conf içinde
#
# Uygulama komutu:
#   sudo -u postgres psql -f postgresql-tuning.sql
#   sudo systemctl restart postgresql
#   sudo systemctl restart teqlif teqlif-staging teqlif-worker teqlif-worker-critical

# ── Bellek ───────────────────────────────────────────────────────────────────
# Redis 4 GB maxmemory aldığı için PostgreSQL'e 2 GB ayrıldı.
shared_buffers = 2GB                # varsayılan: 128MB
effective_cache_size = 6GB          # planner tahmini — gerçek tahsis değil
work_mem = 16MB                     # sort/hash per-operation; max ~100 conn × 16MB
maintenance_work_mem = 256MB        # VACUUM, CREATE INDEX

# ── WAL & Checkpoint ─────────────────────────────────────────────────────────
wal_buffers = 64MB                  # varsayılan: ~3.8MB (shared_buffers'ın %3'ü)
checkpoint_completion_target = 0.9  # checkpoint I/O'yu yay

# ── Depolama (NVMe) ──────────────────────────────────────────────────────────
random_page_cost = 1.1              # varsayılan: 4.0 (HDD için) — NVMe'de random/seq maliyet eşit
effective_io_concurrency = 200      # varsayılan: 1 — NVMe paralel I/O

# ── Bağlantı ─────────────────────────────────────────────────────────────────
max_connections = 100               # değişmedi (restart gerektirir)
