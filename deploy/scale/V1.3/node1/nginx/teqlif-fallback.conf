# /etc/nginx/sites-available/teqlif-fallback.conf — node1
# Cloudflare failover: gateway down olduğunda CF trafiği doğrudan node1'e gelir.
# CF SSL mode: "Full" — self-signed cert yeterli.
# Cert: /etc/ssl/certs/teqlif-fallback.crt (self-signed, 10 yıl)
# Kurulum: node1/nginx/teqlif-fallback.conf → /etc/nginx/sites-available/ → sites-enabled/ symlink
#
# Güvenlik: sadece Cloudflare IP aralıklarından gelen bağlantılar kabul edilir.
# Güncel liste: https://www.cloudflare.com/ips/

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name teqlif.com www.teqlif.com;

    ssl_certificate     /etc/ssl/certs/teqlif-fallback.crt;
    ssl_certificate_key /etc/ssl/private/teqlif-fallback.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cloudflare IPv4
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 108.162.192.0/18;
    allow 131.0.72.0/22;
    allow 141.101.64.0/18;
    allow 162.158.0.0/15;
    allow 172.64.0.0/13;
    allow 173.245.48.0/20;
    allow 188.114.96.0/20;
    allow 190.93.240.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    # Cloudflare IPv6
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
