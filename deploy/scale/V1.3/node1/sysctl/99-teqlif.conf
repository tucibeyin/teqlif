# Teqlif node1 kernel optimizasyonları — 2026-09-10
# Uygulama: sudo tee /etc/sysctl.d/99-teqlif.conf < bu_dosya && sudo sysctl -p /etc/sysctl.d/99-teqlif.conf

# PostgreSQL ve Redis olan makinada swap'ı minimize et (default: 60)
vm.swappiness = 10

# Dirty page write-back — ani I/O spike'larını önle
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# Bağlantı kuyruğu — uvicorn 4 worker için
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# TIME_WAIT soketlerini yeniden kullan
net.ipv4.tcp_tw_reuse = 1
