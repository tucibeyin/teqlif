# Teqlif node1 kernel optimizasyonları — Scale V1.3
# Uygulama: sudo tee /etc/sysctl.d/99-teqlif.conf < bu_dosya && sudo sysctl -p /etc/sysctl.d/99-teqlif.conf

# PostgreSQL ve Redis olan makinada swap'ı minimize et (default: 60)
vm.swappiness = 10

# Redis fork() (RDB/AOF) için overcommit — olmadan background save "Cannot allocate memory" verir
vm.overcommit_memory = 1

# Dirty page write-back — ani I/O spike'larını önle
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# Bağlantı kuyruğu — uvicorn 4 worker için
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# TIME_WAIT soketlerini yeniden kullan
net.ipv4.tcp_tw_reuse = 1

# Gelen paket kuyruğu — 2 Gbps yüksek trafikte drop önler (default: 1000)
net.core.netdev_max_backlog = 16384

# LiveKit SFU UDP soket tamponları — 500 katılımcı SRTP/RTCP için zorunlu
# default (212992 ~208 KB) düşük — packet loss yapar
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# PostgreSQL shared_buffers (3 GB) için huge page havuzu — TLB baskısını azaltır
# 1600 × 2 MB = 3.2 GB — PG startup'tan ÖNCE tahsis edilmesi gerekir
# Bkz. thp-disable.service (huge page + THP disable birlikte çalışır)
vm.nr_hugepages = 1600
