# /etc/systemd/journald.conf.d/99-teqlif.conf — node1
# Uygulama: sudo cp bu_dosya /etc/systemd/journald.conf.d/99-teqlif.conf && sudo systemctl restart systemd-journald
# node1 — 98 GB NVMe, ana backend
# Scale V1.3: Loki retention 14 güne çıktı; journald kısa vadeli yedek (2 gün)

[Journal]
SystemMaxUse=200M
SystemKeepFree=2G
MaxRetentionSec=2d
