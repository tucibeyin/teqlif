# Teqlif node2 kernel optimizasyonları — Scale V1.3
# Uygulama: sudo tee /etc/sysctl.d/99-teqlif.conf < bu_dosya && sudo sysctl -p /etc/sysctl.d/99-teqlif.conf

# 1 GB RAM — swap'a girmesini neredeyse tamamen engelle (default: 60)
vm.swappiness = 1

# Python/asyncio — overcommit açık (default: 0)
vm.overcommit_memory = 1

# accept() kuyruğu — listen() backlog üst sınırı (default: 4096 on Debian 12+)
net.core.somaxconn = 4096

# AI proxy bağlantı kuyruğu
net.ipv4.tcp_max_syn_backlog = 4096
