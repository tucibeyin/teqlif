# /etc/systemd/journald.conf.d/99-teqlif.conf — node2
# Uygulama: sudo cp bu_dosya /etc/systemd/journald.conf.d/99-teqlif.conf && sudo systemctl restart systemd-journald
# node2 — 25 GB SSD, 1 GB RAM; Scale V1.3: journald kısa vadeli yedek

[Journal]
SystemMaxUse=100M
SystemKeepFree=200M
MaxRetentionSec=2d
