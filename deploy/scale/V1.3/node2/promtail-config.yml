# /etc/promtail-config.yml — node2 (RackNerd Buffalo)
# Scale V1.3: Loki artık node3'te (10.10.0.4:3100)
# Dosya bazlı teqlif-ai-proxy job'u kaldırıldı — Loki duplikasyonunu önler.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.10.0.4:3100/loki/api/v1/push

scrape_configs:
  - job_name: systemd-journal
    journal:
      max_age: 12h
      labels:
        job: systemd-journal
        node: node2
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: unit
