# /etc/systemd/journald.conf.d/99-teqlif.conf — gateway
# Uygulama: sudo cp bu_dosya /etc/systemd/journald.conf.d/99-teqlif.conf && sudo systemctl restart systemd-journald
# gateway — 60 GB SSD; Scale V1.3: monitoring node3'e taşındı, journald kısa vadeli yedek

[Journal]
SystemMaxUse=100M
SystemKeepFree=1G
MaxRetentionSec=2d
