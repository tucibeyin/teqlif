# Teqlif gateway kernel optimizasyonları — Scale V1.3
# Uygulama: sudo tee /etc/sysctl.d/99-teqlif.conf < bu_dosya && sudo sysctl -p /etc/sysctl.d/99-teqlif.conf

# nginx olan makinada swap'ı minimize et (default: 60 — YANLIŞ varsayım, açıkça yaz)
vm.swappiness = 10

# VFS cache — nginx open_file_cache ile sinerji; inode lookup maliyetini düşürür
vm.vfs_cache_pressure = 50

# 2 GB × %1.6 ≈ 32 MB rezerv
vm.min_free_kbytes = 32768

# nginx SYN kuyruğu + accept() kuyruğu — default 128 çok düşük
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# TIME_WAIT soketlerini yeniden kullan (default: 2 = loopback only)
net.ipv4.tcp_tw_reuse = 1

# Gelen paket kuyruğu — 1 Gbps interface için (default: 1000)
net.core.netdev_max_backlog = 16384
