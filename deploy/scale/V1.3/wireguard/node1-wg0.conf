# /etc/wireguard/wg0.conf — node1 (OVH Limburg, 135.125.175.223)
# Scale V1.3: 4-node full mesh — node3 [Peer] eklendi
#
# Bu dosyaya NODE1_PRIVATE_KEY, GATEWAY_PUBLIC_KEY, NODE2_PUBLIC_KEY ve NODE3_PUBLIC_KEY yaz.

[Interface]
Address = 10.10.0.1/24
ListenPort = 51820
PrivateKey = <NODE1_PRIVATE_KEY>

PostUp   = ufw allow 51820/udp
PostDown = ufw delete allow 51820/udp

[Peer]  # gateway (Netcup Nürnberg)
PublicKey = <GATEWAY_PUBLIC_KEY>
AllowedIPs = 10.10.0.2/32
# PersistentKeepalive node1 tarafında gerekmez; gateway başlatır

[Peer]  # node2 (RackNerd Buffalo)
PublicKey = <NODE2_PUBLIC_KEY>
AllowedIPs = 10.10.0.3/32

[Peer]  # node3 — Zap-Hosting Ashburn VA — Scale V1.3
PublicKey = <NODE3_PUBLIC_KEY>
AllowedIPs = 10.10.0.4/32
Endpoint = 5.249.165.10:51820
PersistentKeepalive = 25
