# /etc/wireguard/wg0.conf — gateway (Netcup Nürnberg, 94.16.105.135)
# Scale V1.3: 4-node full mesh — node3 [Peer] eklendi
#
# Bu dosyaya GATEWAY_PRIVATE_KEY, NODE1_PUBLIC_KEY, NODE2_PUBLIC_KEY ve NODE3_PUBLIC_KEY yaz.

[Interface]
Address = 10.10.0.2/24
ListenPort = 51820
PrivateKey = <GATEWAY_PRIVATE_KEY>

[Peer]  # node1 (OVH Limburg)
PublicKey = <NODE1_PUBLIC_KEY>
AllowedIPs = 10.10.0.1/32
Endpoint = 135.125.175.223:51820
PersistentKeepalive = 25

[Peer]  # node2 (RackNerd Buffalo)
PublicKey = <NODE2_PUBLIC_KEY>
AllowedIPs = 10.10.0.3/32
Endpoint = 198.12.123.33:51820
PersistentKeepalive = 25

[Peer]  # node3 — Zap-Hosting Ashburn VA — Scale V1.3
PublicKey = <NODE3_PUBLIC_KEY>
AllowedIPs = 10.10.0.4/32
Endpoint = 5.249.165.10:51820
PersistentKeepalive = 25
