# node3 WireGuard konfigürasyonu — /etc/wireguard/wg0.conf
# UYARI: PrivateKey değerleri buraya yazılmaz — VPS'te üretilir, git'e girmez.
# Bu dosya yapısal referanstır.

[Interface]
Address = 10.10.0.4/24
PrivateKey = <node3_private_key>   # wg genkey ile üret
ListenPort = 51820

# node1 — OVHcloud Frankfurt
[Peer]
PublicKey = <node1_public_key>
AllowedIPs = 10.10.0.1/32
Endpoint = 135.125.175.223:51820
PersistentKeepalive = 25

# gateway — Netcup Nürnberg
[Peer]
PublicKey = <gateway_public_key>
AllowedIPs = 10.10.0.2/32
Endpoint = 94.16.105.135:51820
PersistentKeepalive = 25

# node2 — VPSHostingService Buffalo
[Peer]
PublicKey = <node2_public_key>
AllowedIPs = 10.10.0.3/32
Endpoint = 198.12.123.33:51820
PersistentKeepalive = 25
