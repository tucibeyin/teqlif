# /etc/wireguard/wg0.conf — node3 (Zap-Hosting, Ashburn VA, 5.249.165.10)
# Scale V1.3: node3 4-node full mesh'e katılır
#
# Bu dosyaya NODE3_PRIVATE_KEY yaz (git'e girmez — VPS'te üretilir):
#   sudo bash -c 'wg genkey | tee /etc/wireguard/node3_private.key | wg pubkey > /etc/wireguard/node3_public.key'
# Public key'i diğer node'ların wg0.conf'una [Peer] olarak ekle.

[Interface]
Address = 10.10.0.4/24
ListenPort = 51820
PrivateKey = <NODE3_PRIVATE_KEY>

