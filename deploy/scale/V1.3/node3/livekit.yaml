# /etc/livekit/livekit.yaml — node3 (Zap-Hosting Ashburn VA, 5.249.165.10)
# Scale V1.3 — staging LiveKit SFU

prometheus_port: 7881
port: 7880

rtc:
  port_range_start: 50000
  port_range_end: 60000
  udp_port: 7882
  tcp_port: 7882
  use_external_ip: false
  node_ip: "5.249.165.10"

turn:
  enabled: true
  domain: live-staging.teqlif.com
  cert_file: /etc/livekit/certs/fullchain.pem
  key_file: /etc/livekit/certs/privkey.pem
  tls_port: 5349
  udp_port: 3478

keys:
  teqlif_livekit_staging: <LIVEKIT_API_SECRET>

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 100

logging:
  level: info
  json: false

webhook:
  api_key: teqlif_livekit_staging
  urls:
    - https://staging.teqlif.com/api/webhooks/livekit
