# /etc/nginx/sites-available/monitoring.conf — node3
# Prometheus ve Alertmanager admin UI'ı için basic auth proxy (WireGuard mesh içi)
#
# Loki (3100) Promtail push için ayrı tutulur — auth gerektirmez.
# Prometheus ve Alertmanager sadece admin erişimi — basic auth zorunlu.
#
# .htpasswd oluştur (ilk kurulum):
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-monitoring monitoring
#
# Erişim (WireGuard üzerinden):
#   Prometheus:   http://10.10.0.4:9091
#   Alertmanager: http://10.10.0.4:9094
#
# Kurulum: bootstrap_node3.sh tarafından kopyalanır ve etkinleştirilir.

server {
    listen 10.10.0.4:9091;
    server_name _;

    auth_basic "Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd-monitoring;

    location / {
        proxy_pass         http://127.0.0.1:9090;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }
}

server {
    listen 10.10.0.4:9094;
    server_name _;

    auth_basic "Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd-monitoring;

    location / {
        proxy_pass         http://127.0.0.1:9093;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }
}
