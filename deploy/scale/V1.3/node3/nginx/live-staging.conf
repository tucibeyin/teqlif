# /etc/nginx/sites-available/live-staging.conf — node3
# live-staging.teqlif.com → LiveKit SFU (localhost:7880)
# SSL sertifikası Certbot tarafından yönetilir.
#
# Kurulum: bootstrap_node3.sh tarafından kopyalanır ve etkinleştirilir.
# Sertifika: sudo certbot --nginx -d live-staging.teqlif.com

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name live-staging.teqlif.com;

    # Certbot buraya ssl_certificate satırlarını ekler.

    # WebSocket + HTTP proxy → LiveKit
    location / {
        proxy_pass         http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name live-staging.teqlif.com;
    return 301 https://$host$request_uri;
}
