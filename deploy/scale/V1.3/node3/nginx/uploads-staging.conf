# /etc/nginx/sites-available/uploads-staging.conf — node3
# uploads-staging.teqlif.com → MinIO staging (localhost:9010/teqlif-staging/)
# SSL sertifikası Certbot tarafından yönetilir.
#
# Kurulum: bootstrap_node3.sh tarafından kopyalanır ve etkinleştirilir.
# Sertifika: sudo certbot --nginx -d uploads-staging.teqlif.com

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name uploads-staging.teqlif.com;

    ssl_certificate /etc/letsencrypt/live/uploads-staging.teqlif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uploads-staging.teqlif.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # DM (Private) staging bucket proxy - Presigned URL routing
    location /teqlif-dm-staging/ {
        proxy_pass         http://127.0.0.1:9010/teqlif-dm-staging/;
        proxy_set_header   Host $http_host;
        proxy_buffering    off;
        # Presigned URL'ler dinamiktir, cache'lenmez
        add_header         Cache-Control "no-store, no-cache, must-revalidate";
    }

    # MinIO staging bucket proxy (Implicit routing)
    location / {
        proxy_pass         http://127.0.0.1:9010/teqlif-staging/;
        proxy_set_header   Host $http_host;
        proxy_buffering    off;
        expires            365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name uploads-staging.teqlif.com;
    return 301 https://$host$request_uri;
}
