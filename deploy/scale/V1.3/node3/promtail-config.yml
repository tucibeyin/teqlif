# /etc/promtail-config.yml — node3 (Zap-Hosting Ashburn)
# Scale V1.3: logları gateway'deki Loki'ye WireGuard üzerinden gönder
# Log seviyesi WARNING+ — INFO kapalı

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.10.0.2:3100/loki/api/v1/push

scrape_configs:
  - job_name: teqlif-ai-proxy-secondary
    static_configs:
      - targets:
          - localhost
        labels:
          job: teqlif-ai-proxy-secondary
          node: node3
          __path__: /var/log/teqlif/*.log

  - job_name: systemd-journal
    journal:
      max_age: 12h
      labels:
        job: systemd-journal
        node: node3
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: unit
