# Teqlif node3 kernel optimizasyonları — Scale V1.3
# Uygulama: sudo tee /etc/sysctl.d/99-teqlif.conf < bu_dosya && sudo sysctl -p /etc/sysctl.d/99-teqlif.conf

# 3.8 GiB RAM — swap yok; swappiness düşük
vm.swappiness = 10

# Python/asyncio + Redis staging — overcommit açık (default: 0)
vm.overcommit_memory = 1

# VFS cache — staging PG + Prometheus/Loki disk I/O için
vm.vfs_cache_pressure = 50

# 3.8 GB × %1.7 ≈ 64 MB rezerv
vm.min_free_kbytes = 65536

vm.zone_reclaim_mode = 0

# Staging + AI proxy bağlantı kuyruğu
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_tw_reuse = 1

# LiveKit staging SFU UDP soket tamponları — 100 katılımcı için
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# PostgreSQL shared_buffers (1 GB) için huge page havuzu
# 550 × 2 MB = 1.1 GB — PG startup'tan ÖNCE tahsis edilmesi gerekir
vm.nr_hugepages = 550
