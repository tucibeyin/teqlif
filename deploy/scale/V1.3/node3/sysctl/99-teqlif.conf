# Teqlif node3 kernel optimizasyonları
# Uygulama: sudo tee /etc/sysctl.d/99-teqlif.conf < bu_dosya && sudo sysctl -p /etc/sysctl.d/99-teqlif.conf

# 3.8 GiB RAM — swap kapalı, ballooning kapalı
vm.swappiness = 1
vm.overcommit_memory = 1

# AI proxy + staging bağlantı kuyruğu
net.ipv4.tcp_max_syn_backlog = 4096
net.core.somaxconn = 4096
net.ipv4.tcp_tw_reuse = 1
