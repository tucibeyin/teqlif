# /etc/nginx/sites-available/teqlif.conf — gateway
# Scale V1.1: Staging block güçlendirme — security headers + rate limiting eklendi

upstream teqlif_backend {
    server 10.10.0.1:8000;
    keepalive 32;
}

upstream livekit_backend {
    server 10.10.0.1:7880;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name teqlif.com www.teqlif.com staging.teqlif.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    listen [::]:443 ssl default_server;
    server_name teqlif.com www.teqlif.com;

    deny 217.113.194.0/24;

    ssl_certificate /etc/letsencrypt/live/staging.teqlif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.teqlif.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling off;
    ssl_stapling_verify off;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    server_tokens off;
    client_max_body_size 1M;

    location ~* \.(php|asp|aspx|jsp|cgi|phtml|phar)$ { return 444; }
    location ~* /(wp-admin|wp-login|wp-includes|xmlrpc\.php|phpmyadmin) { return 444; }
    location ~ /\.(git|env|htaccess) { deny all; }
    location ~* \.(log|sql)$ { deny all; }

    location /api/auth {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://teqlif_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/upload {
        client_max_body_size 100M;
        proxy_pass http://teqlif_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/chat/ {
        proxy_pass http://teqlif_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=api burst=200 nodelay;
        proxy_pass http://teqlif_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Microcaching — sadece GET/HEAD, Authorization varsa bypass
        proxy_cache teqlif_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$request_method$host$request_uri";
        proxy_cache_valid 200 5s;
        proxy_cache_bypass $http_authorization $http_pragma;
        proxy_no_cache $http_authorization $http_pragma;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /rtc {
        proxy_pass http://livekit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location /livekit/ {
        proxy_pass http://livekit_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* /ws$ {
        proxy_pass http://teqlif_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # /uploads/ fallback — tercih edilen yol: uploads.teqlif.com DNS only → node1 direkt
    location /uploads/ {
        proxy_pass http://10.10.0.1:9010/teqlif/;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://teqlif_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.teqlif.com;

    ssl_certificate /etc/letsencrypt/live/staging.teqlif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.teqlif.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_STAGING:5m;
    ssl_session_timeout 10m;
    ssl_stapling off;
    ssl_stapling_verify off;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
