# Teqlif gateway kernel optimizasyonları — 2026-09-10
# Uygulama: sudo tee /etc/sysctl.d/99-teqlif.conf < bu_dosya && sudo sysctl -p /etc/sysctl.d/99-teqlif.conf
# Not: vm.swappiness=10 ve net.core.somaxconn=4096 zaten doğru değerdeydi.

# nginx SYN kuyruğu — default 128 çok düşük
net.ipv4.tcp_max_syn_backlog = 65535

# TIME_WAIT soketlerini yeniden kullan (default: 2 = loopback only)
net.ipv4.tcp_tw_reuse = 1
