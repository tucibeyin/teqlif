# /etc/wireguard/wg0.conf — node2 (RackNerd Buffalo, 10.10.0.3)
# Scale V1.2: node2 ↔ node1 + node2 ↔ gateway tünelleri
#
# Kurulum:
#   wg genkey | tee /etc/wireguard/node2_private.key | wg pubkey > /etc/wireguard/node2_public.key
#   Bu dosyaya NODE2_PRIVATE_KEY, NODE1_PUBLIC_KEY ve GATEWAY_PUBLIC_KEY yaz.
#   node1 ve gateway'e NODE2_PUBLIC_KEY eklenmeli (6.2 ve 6.3 adımları).

[Interface]
Address = 10.10.0.3/24
ListenPort = 51820
PrivateKey = <NODE2_PRIVATE_KEY>

PostUp   = ufw allow 51820/udp
PostDown = ufw delete allow 51820/udp

[Peer]  # node1 (OVH Limburg)
PublicKey = <NODE1_PUBLIC_KEY>
AllowedIPs = 10.10.0.1/32
Endpoint = 135.125.175.223:51820
PersistentKeepalive = 25

[Peer]  # gateway (Netcup Nürnberg)
PublicKey = <GATEWAY_PUBLIC_KEY>
AllowedIPs = 10.10.0.2/32
Endpoint = 94.16.105.135:51820
PersistentKeepalive = 25
