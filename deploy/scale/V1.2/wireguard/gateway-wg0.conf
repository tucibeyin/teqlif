# /etc/wireguard/wg0.conf — gateway (Netcup Nürnberg, 94.16.105.135)
# Scale V1.2: gateway ↔ node1 + gateway ↔ node2 tünelleri
#
# Bu dosyaya GATEWAY_PRIVATE_KEY, NODE1_PUBLIC_KEY ve NODE2_PUBLIC_KEY yaz.

[Interface]
Address = 10.10.0.2/24
ListenPort = 51820
PrivateKey = <GATEWAY_PRIVATE_KEY>

[Peer]  # node1 (OVH Frankfurt)
PublicKey = <NODE1_PUBLIC_KEY>
AllowedIPs = 10.10.0.1/32
Endpoint = 135.125.175.223:51820
PersistentKeepalive = 25

[Peer]  # node2 (RackNerd Buffalo) — Scale V1.2
PublicKey = <NODE2_PUBLIC_KEY>
AllowedIPs = 10.10.0.3/32
Endpoint = <NODE2_PUBLIC_IP>:51820
PersistentKeepalive = 25
