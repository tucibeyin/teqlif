# /etc/nginx/sites-available/teqlif-fallback.conf — node1
# Cloudflare failover: gateway down olduğunda CF trafiği doğrudan node1'e gelir.
# CF SSL mode: "Full" — self-signed cert yeterli.
# Cert: /etc/ssl/certs/teqlif-fallback.crt (self-signed, 10 yıl)
# Kurulum: node1/nginx/teqlif-fallback.conf → /etc/nginx/sites-available/ → sites-enabled/ symlink

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name teqlif.com www.teqlif.com;

    ssl_certificate     /etc/ssl/certs/teqlif-fallback.crt;
    ssl_certificate_key /etc/ssl/private/teqlif-fallback.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
