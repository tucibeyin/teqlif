# /etc/nginx/sites-available/teqlif.com.conf — V1.4 Gateway
# V1.4 Mimarisinde Gateway SADECE API proxy yapar ve Frontend'i statik olarak sunar.
# Medya (LiveKit/MinIO) proxy edilmez, Edge Node'lar üzerinden (Bypass) direkt çıkar.

upstream teqlif_core {
    server 10.10.0.5:8000; # Node5 (Core)
    keepalive 32;
}

upstream teqlif_staging {
    server 10.10.0.4:8001; # Node3 (Staging)
    keepalive 8;
}

# ── Frontend (Prod) ──────────────────────────────────────────────
server {
    listen 80;
    server_name teqlif.com www.teqlif.com;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /var/www/teqlif.com/frontend;
    index app-landing.html;

    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /app-landing.html;
    }
}

# ── API (Prod) ──────────────────────────────────────────────
server {
    listen 80;
    server_name api.teqlif.com;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 100M;

    location = /cf-health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    location = / {
        return 302 https://teqlif.com/;
    }

    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://teqlif_core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

