# /etc/promtail-config.yml — gateway
# Scale V1.4: gateway loglarını node3 Loki'ye gönderir (10.10.0.4:3100)

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://10.10.0.4:3100/loki/api/v1/push

scrape_configs:
  - job_name: systemd-journal
    journal:
      max_age: 12h
      labels:
        job: systemd-journal
        node: gateway
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: unit
