[databases]
teqlif_staging = host=127.0.0.1 port=5432 dbname=teqlif_staging

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 50
default_pool_size = 10
reserve_pool_size = 2
min_pool_size = 2

server_reset_query = DISCARD ALL
server_login_retry = 3

; asyncpg startup parametrelerini geç — "unsupported startup parameter" hatasını önler
ignore_startup_parameters = extra_float_digits

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; Admin konsol (psql -p 6432 pgbouncer)
admin_users = tucibeyin
stats_users = tucibeyin
