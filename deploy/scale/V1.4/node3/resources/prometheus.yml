# /etc/prometheus/prometheus.yml — node3
# Scale V1.3: Prometheus gateway'den node3'e taşındı; node3 + node-gateway hedefleri eklendi

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-gateway'
    static_configs:
      - targets: ['10.10.0.2:9100']
        labels:
          node: gateway

  - job_name: 'node-node1'
    static_configs:
      - targets: ['10.10.0.1:9100']
        labels:
          node: node1

  - job_name: 'node-node2'
    static_configs:
      - targets: ['10.10.0.3:9100']
        labels:
          node: node2

  - job_name: 'node-node3'
    static_configs:
      - targets: ['10.10.0.4:9100']
        labels:
          node: node3

  - job_name: 'livekit'
    static_configs:
      - targets: ['10.10.0.1:7881']
        labels:
          node: node1

  - job_name: 'postgres'
    static_configs:
      - targets: ['10.10.0.1:9187']
        labels:
          node: node1
