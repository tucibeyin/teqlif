limit_req_zone $binary_remote_addr zone=media_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/s;

upstream minio_primary {
    server 127.0.0.1:9000;
    keepalive 32;
}

upstream minio_node8 {
    server 10.10.0.12:9000;
    keepalive 16;
}

# Media CDN — cached read-only
server {
    listen 443 ssl;
    server_name media.teqlif.com;

    ssl_certificate     /etc/ssl/teqlif/cf-origin.crt;
    ssl_certificate_key /etc/ssl/teqlif/cf-origin.key;

    # Cloudflare real IP ranges
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    limit_req zone=media_limit burst=200 nodelay;

    proxy_cache storage_cache;
    proxy_cache_valid 200 7d;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock on;

    add_header Cache-Control "public, max-age=604800, immutable";
    add_header X-Cache-Status $upstream_cache_status;

    location / {
        proxy_pass http://minio_primary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 = @media_fallback_node8;
    }

    location @media_fallback_node8 {
        proxy_pass http://minio_node8;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Uploads endpoint — presigned PUT, no cache
server {
    listen 443 ssl;
    server_name uploads.teqlif.com;

    ssl_certificate     /etc/ssl/teqlif/cf-origin.crt;
    ssl_certificate_key /etc/ssl/teqlif/cf-origin.key;

    add_header Cache-Control "no-store";

    limit_req zone=upload_limit burst=20 nodelay;

    location / {
        proxy_pass http://minio_primary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        client_max_body_size 500m;
        proxy_intercept_errors on;
        error_page 502 503 504 = @upload_fallback_node8;
    }

    location @upload_fallback_node8 {
        proxy_pass http://minio_node8;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        client_max_body_size 500m;
    }
}

server {
    listen 80;
    server_name media.teqlif.com uploads.teqlif.com;
    return 301 https://$host$request_uri;
}
