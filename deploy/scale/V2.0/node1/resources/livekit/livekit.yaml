port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
  ice_lite: false

turn:
  enabled: true
  domain: live1.teqlif.com
  tls_port: 5349
  udp_port: 3478
  relay_range_start: 50000
  relay_range_end: 60000
  cert_file: /etc/ssl/teqlif/cf-origin.crt
  key_file:  /etc/ssl/teqlif/cf-origin.key

redis:
  address: 10.10.0.11:6379
  db: 1
  password: <core_redis_pass>

keys:
  <livekit_api_key>: <livekit_api_secret>

logging:
  level: info
  json: true
