node_id: node5
env: production
guardian_priority: 90
network:
  public_ip: <node5_public_ip>
  wg_ip: 10.10.0.5
  wg_port: 51820
  guardian_port: 9200
  speed_mbps: 4000
hardware:
  cpu_cores: 4
  cpu_model: "AMD EPYC"
  ram_gb: 7.8
  disks:
    - path: /
      size_gb: 49
      type: nvme
  provider: "Deluxhost, Amsterdam"
components:
  - postgresql
  - pgbouncer
  - redis-core
  - redis-orch
  - redis-guardian
  - keepalived
  - teqlif
  - teqlif-worker
  - teqlif-worker-critical
  - teqlif-ai-proxy
  - postgres-exporter
  - fail2ban
  - wireguard
  - teqlif-guardian
  - promtail
