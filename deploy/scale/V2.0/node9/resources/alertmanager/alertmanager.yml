global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: ops
  routes:
    - match:
        severity: critical
      receiver: alerts
      continue: false

receivers:
  - name: ops
    telegram_configs:
      - bot_token: <TELEGRAM_BOT_TOKEN>
        chat_id: <TELEGRAM_CHAT_ID_OPS>
        message: '{{ range .Alerts }}[{{ .Labels.severity | toUpper }}] {{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.description }}{{ "\n\n" }}{{ end }}'
        parse_mode: HTML

  - name: alerts
    telegram_configs:
      - bot_token: <TELEGRAM_BOT_TOKEN>
        chat_id: <TELEGRAM_CHAT_ID_ALERTS>
        message: '{{ range .Alerts }}🚨 [{{ .Labels.severity | toUpper }}] {{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.description }}{{ "\n\n" }}{{ end }}'
        parse_mode: HTML

inhibit_rules:
  - source_match:
      alertname: NodeDown
    target_match_re:
      severity: "warning"
    equal: ['instance']
