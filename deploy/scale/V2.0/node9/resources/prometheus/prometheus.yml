global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets:
          - 10.10.0.5:9187    # node5 postgres_exporter

  - job_name: teqlif_guardian
    static_configs:
      - targets:
          - 10.10.0.2:9200    # gateway1
          - 10.10.0.9:9200    # gateway2
          - 10.10.0.1:9200    # node1
          - 10.10.0.3:9200    # node2
          - 10.10.0.4:9200    # node3
          - 10.10.0.6:9200    # node4
          - 10.10.0.5:9200    # node5
          - 10.10.0.7:9200    # node6
          - 10.10.0.8:9200    # node7
          - 10.10.0.12:9200   # node8
          - 127.0.0.1:9200    # node9
