server:
  http_listen_address: 127.0.0.1
  http_listen_port: 9080
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://10.10.0.99:3100/loki/api/v1/push
    tenant_id: teqlif

scrape_configs:
  - job_name: teqlif-api
    static_configs:
      - targets: [localhost]
        labels:
          job: teqlif-api
          node: node1
          __path__: /var/www/teqlif.com/backend/logs/node-app.log

  - job_name: teqlif-errors
    static_configs:
      - targets: [localhost]
        labels:
          job: teqlif-errors
          node: node1
          __path__: /var/www/teqlif.com/backend/logs/node-error.log

  - job_name: teqlif-worker
    static_configs:
      - targets: [localhost]
        labels:
          job: teqlif-worker
          node: node1
          __path__: /var/www/teqlif.com/backend/logs/node-worker.log

  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          node: node1
          __path__: /var/log/nginx/*.log

  - job_name: journal
    journal:
      labels:
        job: systemd-journal
        node: node1
    relabel_configs:
      - source_labels: [__journal__systemd_unit]
        target_label: unit
