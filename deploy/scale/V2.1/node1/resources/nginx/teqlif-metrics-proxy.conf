# FastAPI /metrics endpoint'ini WireGuard arayüzüne (10.10.0.1:9182) açar.
# Yalnızca WireGuard alt ağından (nodeMonitor) erişilebilir.
server {
    listen 10.10.0.1:9182;
    server_name _;

    location = /metrics {
        allow 10.10.0.0/24;
        deny  all;
        proxy_pass         http://127.0.0.1:8000/metrics;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
        access_log off;
    }

    location / {
        return 404;
    }
}
