# teqlif — Agresif / tarayıcı IP blok listesi (repo-merkezli tek doğruluk kaynağı)
#
# Bu dosya node1'de /etc/nginx/conf.d/00-blocklist.conf olarak dağıtılır
# (teqlif-restart → sync_nginx). conf.d/*.conf http context'ine alfabetik yüklenir;
# "00-" öneki geo değişkeninin teqlif.conf / minio.conf server bloklarından ÖNCE
# tanımlanmasını garanti eder.
#
# ── IP EKLEME ────────────────────────────────────────────────────────────────
#   1) Bu dosyaya satır ekle:   <IP veya CIDR>   1;   # açıklama + tarih
#   2) Repo'ya commit + push et, prod'da: sudo teqlif-restart
#   (sync_nginx diff görür → kopyalar, nginx -t, reload; hata olursa .bak'tan döner)
#
# ── IP KALDIRMA ──────────────────────────────────────────────────────────────
#   Satırı sil (veya değeri 0 yap) → commit → sudo teqlif-restart
#
# ── NEDEN $remote_addr? ──────────────────────────────────────────────────────
#   Cloudflare arkasındaki hostlarda (teqlif.com, api.teqlif.com) nginx.conf'taki
#   set_real_ip_from + CF-Connecting-IP, $remote_addr'i GERÇEK istemci IP'sine yazar.
#   uploads.teqlif.com DNS-only olduğu için $remote_addr zaten istemci IP'sidir.
#   Her iki senaryoda eşleşme doğru çalışır.
#
# ── ACİL DURUM (repo beklemeden) ─────────────────────────────────────────────
#   Canlı dosyada satırı düzenle → sudo nginx -t && sudo systemctl reload nginx
#   ARDINDAN repo'ya aynı değişikliği commit et: sonraki sync_nginx canlı dosyanın
#   üzerine repo içeriğini yazar.

geo $teqlif_blocked_ip {
    default 0;

    # ── Sızıntı / dotfile tarayıcıları (deny kuralı ihlalleri) ───────────────
    35.240.59.25    1;   # GCP — toplu dotfile/config taraması (2026-11-20 12:23 UTC)

    # ── Format örneği ────────────────────────────────────────────────────────
    # 203.0.113.0/24  1;   # örnek: açıklama (YYYY-MM-DD)
}
