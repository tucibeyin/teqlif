upstream teqlif_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# api.teqlif.com + teqlif.com — Cloudflare Proxied
server {
    listen 443 ssl;
    server_name api.teqlif.com teqlif.com www.teqlif.com;

    ssl_certificate     /etc/ssl/teqlif/cf-origin.crt;
    ssl_certificate_key /etc/ssl/teqlif/cf-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    300s;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Presigned upload mimarisi: API sadece JSON/WS taşır, video binary taşımaz
    client_max_body_size 5m;

    # CGNAT: aynı IP'den çok kullanıcı bağlanabilir
    limit_conn conn_limit 100;

    location /api/messages/ws {
        proxy_pass http://teqlif_app;
        proxy_read_timeout 3600s;
        limit_conn conn_limit 20;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://teqlif_app;
    }

    location / {
        proxy_pass http://teqlif_app;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name api.teqlif.com teqlif.com www.teqlif.com;
    return 301 https://$host$request_uri;
}
