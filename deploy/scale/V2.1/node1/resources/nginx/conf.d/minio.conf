# uploads.teqlif.com — DNS Only (Cloudflare bypass), MinIO presigned media
# Video dahil tüm media bu server block üzerinden geçer.
# client_max_body_size 0: presigned PUT yüklemeleri nginx üzerinden MinIO'ya akış.
server {
    listen 443 ssl;
    server_name uploads.teqlif.com;

    ssl_certificate     /etc/letsencrypt/live/uploads.teqlif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uploads.teqlif.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Presigned PUT/GET — sınır yok, MinIO yönetir
    client_max_body_size 0;

    # Dosyayı buffer'a almadan direkt akış (büyük video upload/download için kritik)
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;

    location / {
        proxy_pass http://127.0.0.1:9000;
    }
}

server {
    listen 80;
    server_name uploads.teqlif.com;
    return 301 https://$host$request_uri;
}
