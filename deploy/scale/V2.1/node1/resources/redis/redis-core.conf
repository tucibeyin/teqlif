# redis-core — uygulama cache, ARQ queue, LiveKit koordinasyonu
# Port: 6379 | Data: /project/teqlif/data/redis/core

bind 127.0.0.1 10.10.0.1
port 6379
requirepass <core_redis_pass>

daemonize no
loglevel notice
logfile /project/teqlif/logs/redis-core.log

dir /project/teqlif/data/redis/core
dbfilename dump-core.rdb
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly-core.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

tcp-keepalive 300
timeout 0
tcp-backlog 511
