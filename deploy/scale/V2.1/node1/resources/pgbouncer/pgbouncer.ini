[databases]
teqlif = host=127.0.0.1 port=5432 dbname=teqlif user=teqlif

[pgbouncer]
ignore_startup_parameters = extra_float_digits
stats_users = prometheus
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/postgresql
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
# CACHE-22: PgBouncer 1.21+ native prepared statement desteği.
# asyncpg statement cache yeniden etkinleştirildi (database.py workaround kaldırıldı).
max_prepared_statements = 200
max_client_conn = 1000
default_pool_size = 40
max_db_connections = 60
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = select 1
client_idle_timeout = 600
server_idle_timeout = 600
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
