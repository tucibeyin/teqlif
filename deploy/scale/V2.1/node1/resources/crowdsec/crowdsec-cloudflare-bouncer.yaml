# crowdsec-cloudflare-bouncer v0.3.0 — node1 config template
# /etc/crowdsec/bouncers/crowdsec-cloudflare-bouncer.yaml
#
# Doldurulacak alanlar (bootstrap sırasında apply_secrets tarafından inject edilir):
#   cs_lapi_key          → cscli bouncers add ile dinamik üretilir (bootstrap inject eder)
#   CLOUDFLARE_ACCOUNT_ID→ Cloudflare Dashboard > sağ sidebar > Account ID
#   CLOUDFLARE_TOKEN     → Account Filter Lists:Edit + Zone Firewall Services:Edit
#
# ⚠️  zones YOK — Cloudflare Firewall Rules API deprecated (error 10020).
#     Bouncer sadece Account-level IP listesi (crowdsec_block) yönetir.
#     Blok için manuel adım: Cloudflare Dashboard → teqlif.com → Security → WAF →
#     Custom Rules → Create Rule:
#       Name   : crowdsec-block
#       If     : (ip.src in $crowdsec_block)
#       Action : Block
#     Bu kural, CrowdSec'in yasakladığı IP'leri edge'de durdurur.
#
# Mimari notu: crowdsec-firewall-bouncer (iptables) VE bu bouncer aynı anda çalışır
#   iptables : DNS-only hostlar (uploads.teqlif.com, minio.teqlif.com)
#   Cloudflare: proxied hostlar (teqlif.com, api.teqlif.com) — IP listesi üzerinden

# CrowdSec Config
crowdsec_lapi_url: http://localhost:8080/
crowdsec_lapi_key: <cs_lapi_key>
crowdsec_update_frequency: 10s

include_scenarios_containing: []
exclude_scenarios_containing: []
only_include_decisions_from: []

# Cloudflare Config
# zones kaldırıldı — Firewall Rules API deprecated (Cloudflare error 10020)
# Blocking için WAF Custom Rule'u manuel oluştur (yukarıdaki açıklamaya bak)
cloudflare_config:
  accounts:
    - id: <CLOUDFLARE_ACCOUNT_ID>
      token: <CLOUDFLARE_TOKEN>
      ip_list_prefix: crowdsec
      default_action: block

  update_frequency: 30s

# Bouncer Config
daemon: false
log_mode: file
log_dir: /var/log/crowdsec
log_level: info
log_max_size: 40
log_max_age: 30
log_max_backups: 3
compress_logs: true

prometheus:
  enabled: false
  listen_addr: 127.0.0.1
  listen_port: 2112
