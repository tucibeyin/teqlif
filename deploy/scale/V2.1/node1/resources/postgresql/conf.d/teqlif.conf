# teqlif V2.1 — node1 (OVH Gravelines, 32GB RAM, NVMe RAID-1)
# Memory
shared_buffers = 8GB
effective_cache_size = 24GB
work_mem = 64MB
maintenance_work_mem = 2GB
huge_pages = on

# WAL / Replication
wal_level = replica
max_wal_senders = 5
wal_keep_size = 1GB
hot_standby = on
synchronous_commit = off
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# WAL / Timeout — BIZ-02 K4 (node2_receivewal kesintisinde disk dolmasın)
wal_compression = lz4
archive_timeout = 3600
max_slot_wal_keep_size = '50GB'
lock_timeout = '5s'
idle_in_transaction_session_timeout = '5min'

# Connections
max_connections = 150
listen_addresses = 'localhost,10.10.0.1'

# NVMe optimized
random_page_cost = 1.1
effective_io_concurrency = 200
seq_page_cost = 1.0

# Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on

# Autovacuum
autovacuum_max_workers = 4
autovacuum_vacuum_scale_factor = 0.01
autovacuum_analyze_scale_factor = 0.005
