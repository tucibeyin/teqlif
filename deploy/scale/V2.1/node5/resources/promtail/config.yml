server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://10.10.0.2:3100/loki/api/v1/push
    tenant_id: teqlif

scrape_configs:
  - job_name: teqlif-staging
    static_configs:
      - targets: [localhost]
        labels:
          job: teqlif-staging
          node: node5
          __path__: /project/teqlif/logs/api/*.log

  - job_name: journal
    journal:
      labels:
        job: systemd-journal
        node: node5
    relabel_configs:
      - source_labels: [__journal__systemd_unit]
        target_label: unit
