# node5 — Staging + AI Secondary, KVM VPS
# LiveKit TURN (staging) için UDP buffer ayarları — node3/node4 ile aynı pattern,
# düşük eşikler: staging düşük trafikli, tam prod değerleri gerekmez.
vm.swappiness = 20
net.core.somaxconn = 32768
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
fs.file-max = 300000

# UDP buffer — TURN relay için (node3: 26MB, staging: 8MB yeterli)
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608
net.core.rmem_default = 524288
net.core.wmem_default = 524288
net.ipv4.udp_mem = 65536 436900 8388608

# TURN relay port aralığını (55000-60000) ephemeral port havuzundan çıkar
net.ipv4.ip_local_port_range = 1024 54999

# conntrack — TURN UDP oturumları için (node3: 262144, staging: 65536 yeterli)
net.netfilter.nf_conntrack_max = 65536
