# staging.teqlif.com — frontend static + API proxy
server {
    listen 443 ssl;
    server_name staging.teqlif.com;

    ssl_certificate     /etc/ssl/teqlif/cf-origin.crt;
    ssl_certificate_key /etc/ssl/teqlif/cf-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;
    limit_conn conn_limit 50;

    root  /var/www/teqlif.com/frontend;
    index index.html;

    # Static assets — serve directly with caching
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket
    location /api/messages/ws {
        proxy_pass         http://10.10.0.5:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        limit_conn conn_limit 20;
    }

    # API calls — proxy to staging FastAPI
    location /api/ {
        proxy_pass         http://10.10.0.5:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
        limit_req zone=staging_limit burst=30 nodelay;
    }

    # FastAPI-owned root-level files
    location = /ads.txt    { proxy_pass http://10.10.0.5:8000; proxy_set_header Host $host; }
    location = /robots.txt { proxy_pass http://10.10.0.5:8000; proxy_set_header Host $host; }

    # HTML pages — serve directly, fall back to 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

# api-staging.teqlif.com — API only, no static files
server {
    listen 443 ssl;
    server_name api-staging.teqlif.com;

    ssl_certificate     /etc/ssl/teqlif/cf-origin.crt;
    ssl_certificate_key /etc/ssl/teqlif/cf-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;
    limit_conn conn_limit 50;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    300s;

    location = / { return 302 https://staging.teqlif.com; }

    location /api/messages/ws {
        proxy_pass http://10.10.0.5:8000;
        proxy_read_timeout 3600s;
        limit_conn conn_limit 20;
    }

    location / {
        limit_req zone=staging_limit burst=30 nodelay;
        proxy_pass http://10.10.0.5:8000;
    }
}

# staging.uploads.teqlif.com — DNS Only, Let's Encrypt, MinIO staging
server {
    listen 443 ssl;
    server_name staging.uploads.teqlif.com;

    ssl_certificate     /etc/letsencrypt/live/staging.uploads.teqlif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.uploads.teqlif.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;

    location / {
        proxy_pass http://127.0.0.1:9100;
    }
}

# live-staging.teqlif.com — LiveKit staging (DNS Only, Let's Encrypt)
server {
    listen 443 ssl;
    server_name live-staging.teqlif.com;

    ssl_certificate     /etc/letsencrypt/live/live-staging.teqlif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live-staging.teqlif.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 0;
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;

    proxy_connect_timeout 10s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;

    location / {
        proxy_pass http://127.0.0.1:7890;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name staging.teqlif.com api-staging.teqlif.com staging.uploads.teqlif.com live-staging.teqlif.com;
    location /.well-known/acme-challenge/ { root /var/www/teqlif.com/frontend; }
    location / { return 301 https://$host$request_uri; }
}
