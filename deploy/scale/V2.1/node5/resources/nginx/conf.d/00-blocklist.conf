# teqlif STAGING — Kalıcı nginx IP blok listesi (repo-merkezli tek doğruluk kaynağı)
#
# Bu dosya node5'te /etc/nginx/conf.d/00-blocklist.conf olarak dağıtılır
# (teqlif-restart → sync_nginx). conf.d/*.conf http context'ine alfabetik yüklenir;
# "00-" öneki geo değişkeninin teqlif-staging.conf server bloklarından ÖNCE
# tanımlanmasını garanti eder.
#
# ── NE ZAMAN KULLANILIR? ─────────────────────────────────────────────────────
#   SADECE CrowdSec'in ban süresini (maks 24–48h) aşacak KALICI bloklar için.
#   Rutin tarayıcı/bot IP'leri buraya eklenmez — CrowdSec otomatik tespit eder
#   ve kararları iptables'a push eder.
#
# ── IP EKLEME ────────────────────────────────────────────────────────────────
#   1) Bu dosyaya satır ekle:   <IP veya CIDR>   1;   # açıklama + tarih
#   2) Repo'ya commit + push et, staging'de: sudo teqlif-restart
#   (sync_nginx diff görür → kopyalar, nginx -t, reload; hata olursa .bak'tan döner)
#
# ── IP KALDIRMA ──────────────────────────────────────────────────────────────
#   Satırı sil (veya değeri 0 yap) → commit → sudo teqlif-restart
#
# ── NEDEN $remote_addr? ──────────────────────────────────────────────────────
#   Cloudflare arkasındaki hostlarda (staging.teqlif.com, api-staging.teqlif.com)
#   nginx.conf'taki set_real_ip_from + CF-Connecting-IP, $remote_addr'i GERÇEK
#   istemci IP'sine yazar. staging.uploads / live-staging DNS-only olduğu için
#   $remote_addr zaten istemci IP'sidir. Her iki senaryoda eşleşme doğrudur.
#
# ── ACİL DURUM (repo beklemeden) ─────────────────────────────────────────────
#   Canlı dosyada satırı düzenle → sudo nginx -t && sudo systemctl reload nginx
#   ARDINDAN repo'ya aynı değişikliği commit et: sonraki sync_nginx canlı dosyanın
#   üzerine repo içeriğini yazar.

geo $teqlif_blocked_ip {
    default 0;

    # ── Kalıcı bloklar (CrowdSec otomasyonu dışı) ────────────────────────────
    # Örnek: 203.0.113.0/24  1;   # açıklama (YYYY-MM-DD)
}
