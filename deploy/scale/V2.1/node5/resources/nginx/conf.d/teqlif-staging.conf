# staging.teqlif.com — frontend static + API proxy
server {
    listen 443 ssl;
    server_name staging.teqlif.com;

    ssl_certificate     /etc/ssl/teqlif/cf-origin.crt;
    ssl_certificate_key /etc/ssl/teqlif/cf-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 60m;
    limit_conn conn_limit 50;

    # Agresif IP blok listesi — 00-blocklist.conf içindeki geo değişkeni.
    # `return` kullanılıyor (deny değil): deny modülü error_log'a [error] yazar,
    # return ise yalnızca access_log'a 403 düşer → alarm gürültüsü oluşmaz.
    if ($teqlif_blocked_ip) { return 403; }

    root  /var/www/teqlif.com/frontend;
    index index.html;

    # Well-known — allow RFC 8615 URIs (Android App Links, Apple Universal Links, ACME)
    # ^~ prefix olduğu için alttaki regex dotfile kuralından önce eşleşir.
    location ^~ /.well-known/ {
        allow all;
    }

    # Hidden files — block dot-file access (.git, .env, .htaccess, etc.)
    # Prod (node1) ile parite: staging'de bu kural daha önce HİÇ yoktu.
    location ~ /\. {
        return 404;
    }

    # Static assets — serve directly with caching
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket — chat, açık artırma, mesajlar, bildirimler
    # limit_req YOK: uzun yaşayan WS bağlantıları rate-limit'e takılmamalıdır.
    location ~ ^/api/(chat|auction|messages|notifications)/.*ws {
        proxy_pass         http://10.10.0.5:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API calls — proxy to staging FastAPI
    location /api/ {
        proxy_pass         http://10.10.0.5:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
        limit_req zone=staging_limit burst=60 nodelay;
    }

    # FastAPI-owned root-level files
    location = /ads.txt     { proxy_pass http://10.10.0.5:8000; proxy_set_header Host $host; }
    location = /robots.txt  { proxy_pass http://10.10.0.5:8000; proxy_set_header Host $host; }
    location = /sitemap.xml { proxy_pass http://10.10.0.5:8000; proxy_set_header Host $host; }

    # HTML pages — serve directly, fall back to 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

# api-staging.teqlif.com — API only, no static files
server {
    listen 443 ssl;
    server_name api-staging.teqlif.com;

    ssl_certificate     /etc/ssl/teqlif/cf-origin.crt;
    ssl_certificate_key /etc/ssl/teqlif/cf-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 60m;
    limit_conn conn_limit 50;

    # Agresif IP blok listesi — 00-blocklist.conf içindeki geo değişkeni.
    if ($teqlif_blocked_ip) { return 403; }

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    300s;

    location = / { return 302 https://staging.teqlif.com; }

    # WebSocket — tüm WS rotaları; limit_req YOK, Upgrade/Connection server seviyesinden kalıtılır
    location ~ ^/api/(chat|auction|messages|notifications)/.*ws {
        proxy_pass http://10.10.0.5:8000;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=staging_limit burst=60 nodelay;
        proxy_pass http://10.10.0.5:8000;
    }
}

# staging.uploads.teqlif.com — DNS Only, Let's Encrypt, MinIO staging
server {
    listen 443 ssl;
    server_name staging.uploads.teqlif.com;

    ssl_certificate     /etc/letsencrypt/live/staging.uploads.teqlif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.uploads.teqlif.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 0;

    # Agresif IP blok listesi — 00-blocklist.conf içindeki geo değişkeni.
    # DNS Only host: $remote_addr zaten gerçek istemci IP'sidir.
    if ($teqlif_blocked_ip) { return 403; }

    proxy_buffering off;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;

    # Web crawler / botların MinIO'da "robots.txt" bucket'ı aramasını ve 403 üretmesini engelle
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:9100;
    }
}

# live-staging.teqlif.com — LiveKit staging (DNS Only, Let's Encrypt)
server {
    listen 443 ssl;
    server_name live-staging.teqlif.com;

    ssl_certificate     /etc/letsencrypt/live/live-staging.teqlif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live-staging.teqlif.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 0;

    # Agresif IP blok listesi — 00-blocklist.conf içindeki geo değişkeni.
    if ($teqlif_blocked_ip) { return 403; }

    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;

    proxy_connect_timeout 10s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;

    location / {
        proxy_pass http://127.0.0.1:7890;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name staging.teqlif.com api-staging.teqlif.com staging.uploads.teqlif.com live-staging.teqlif.com;
    location /.well-known/acme-challenge/ { root /var/www/teqlif.com/frontend; }
    location / { return 301 https://$host$request_uri; }
}
