port: 7890
rtc:
  tcp_port: 7891
  port_range_start: 50100
  port_range_end: 50200
  use_external_ip: true

redis:
  address: 127.0.0.1:6379
  db: 2
  password: <staging_redis_pass>

keys:
  <livekit_stg_api_key>: <livekit_stg_api_secret>

webhook:
  urls:
    - https://staging.teqlif.com/api/webhooks/livekit
  api_key: <livekit_stg_api_key>

turn:
  enabled: true
  domain: live-staging.teqlif.com
  tls_port: 5349
  udp_port: 3478
  relay_range_start: 55000
  relay_range_end: 60000
  cert_file: /project/teqlif/config/ssl/live-staging.teqlif.com-fullchain.pem
  key_file:  /project/teqlif/config/ssl/live-staging.teqlif.com-privkey.pem

logging:
  level: info
  json: true
