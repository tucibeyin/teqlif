server:
  http_listen_address: 127.0.0.1
  http_listen_port: 9080
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://10.10.0.99:3100/loki/api/v1/push
    tenant_id: teqlif

scrape_configs:
  # Systemd journal — restic-rest-server, teqlif-agent, teqlif-offsite-*,
  # teqlif-offsite-prune, teqlif-offsite-verify, crowdsec, auditd vb.
  - job_name: journal
    journal:
      labels:
        job: systemd-journal
        node: node101
    relabel_configs:
      - source_labels: [__journal__systemd_unit]
        target_label: unit
