# node2'ye özel node_exporter override — systemd collector ekler.
# Kurulum: sudo cp node-exporter-override.conf /etc/systemd/system/node-exporter.service.d/override.conf
#          sudo systemctl daemon-reload && sudo systemctl restart node-exporter
#
# stalwart-mail.service durumu Prometheus metriği olarak:
#   node_systemd_unit_state{name="stalwart-mail.service",state="active"} == 1

[Service]
ExecStart=
ExecStart=/bin/bash -c 'exec /usr/local/bin/node_exporter \
  --web.listen-address=$(ip -4 addr show wg0 | grep -oP "(?<=inet )[\d.]+" | head -1):9100 \
  --collector.systemd \
  --collector.systemd.unit-include="stalwart-mail\\.service"'
