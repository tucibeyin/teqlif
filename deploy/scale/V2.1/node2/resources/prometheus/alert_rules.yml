groups:
  - name: teqlif_infra
    interval: 30s
    rules:

      # ── Node erişilebilirlik ────────────────────────────────────────────────
      - alert: NodeDown
        expr: up{job="teqlif_nodes"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node erişilemiyor: {{ $labels.instance }}"
          description: "node_exporter {{ $labels.instance }} 2 dakikadır yanıt vermiyor"

      # ── CPU ────────────────────────────────────────────────────────────────
      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Yüksek CPU: {{ $labels.instance }}"
          description: "CPU kullanımı %{{ $value | printf \"%.0f\" }} (eşik: %%85)"

      # ── Bellek ────────────────────────────────────────────────────────────
      - alert: HighMemory
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Yüksek bellek: {{ $labels.instance }}"
          description: "Bellek kullanımı %{{ $value | printf \"%.0f\" }} (eşik: %%90)"

      # ── Disk ──────────────────────────────────────────────────────────────
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs"} / node_filesystem_size_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk dolmak üzere: {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} boş alan: %{{ $value | printf \"%.0f\" }} (eşik: %%15)"

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs"} / node_filesystem_size_bytes) * 100 < 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk kritik seviyede: {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} boş alan: %{{ $value | printf \"%.0f\" }} — acil müdahale gerekli"

      # ── PostgreSQL ────────────────────────────────────────────────────────
      - alert: PostgreSQLDown
        expr: pg_up{job="teqlif_postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL erişilemiyor (node1)"
          description: "postgres_exporter node1:9187 yanıt vermiyor — uygulama DB bağlantısı koptu"

      # ── AI Proxy ──────────────────────────────────────────────────────────
      - alert: AIPrimaryDown
        expr: up{job="teqlif_nodes", instance="10.10.0.6:9100"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AI Primary down (node6)"
          description: "node6 erişilemiyor — AI proxy node5'e (secondary) devredildi"

      - alert: AISecondaryDown
        expr: up{job="teqlif_nodes", instance="10.10.0.5:9100"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "AI Secondary down (node5)"
          description: "node5 erişilemiyor — node6 primary tek başına, failover yok"

      - alert: AIBothDown
        expr: >
          up{job="teqlif_nodes", instance="10.10.0.6:9100"} == 0
          and
          up{job="teqlif_nodes", instance="10.10.0.5:9100"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AI Proxy tamamen erişilemiyor (node5 + node6)"
          description: "Her iki AI proxy da down — AI özellikler 503 dönüyor"

      # ── LiveKit ───────────────────────────────────────────────────────────
      - alert: LiveKitHighParticipants
        expr: livekit_room_participants_total > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "LiveKit yüksek katılımcı: {{ $labels.instance }}"
          description: "{{ $value | printf \"%.0f\" }} katılımcı — yeni streaming node eklemeyi değerlendir"

      - alert: LiveKitNodeDown
        expr: up{job="teqlif_livekit"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "LiveKit node erişilemiyor: {{ $labels.instance }}"
          description: "Streaming kapasitesi düştü — aktif yayınlar etkilenmiş olabilir"
