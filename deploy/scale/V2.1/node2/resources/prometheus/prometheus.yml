global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Tüm metrikler bu label'la etiketlenir — başka proje eklenince buraya eklenir
  external_labels:
    project: teqlif

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: teqlif_postgres
    static_configs:
      - targets:
          - 10.10.0.1:9187    # node1 postgres_exporter

  - job_name: teqlif_nodes
    static_configs:
      - targets:
          - 10.10.0.1:9100    # node1
          - 10.10.0.2:9100    # node2 (lokal)
          - 10.10.0.3:9100    # node3
          - 10.10.0.4:9100    # node4
          - 10.10.0.5:9100    # node5
          - 10.10.0.6:9100    # node6

  - job_name: teqlif_livekit
    static_configs:
      - targets:
          - 10.10.0.3:7880    # node3 LiveKit
          - 10.10.0.4:7880    # node4 LiveKit
