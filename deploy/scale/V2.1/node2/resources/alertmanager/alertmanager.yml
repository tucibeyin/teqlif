global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: ops
  routes:
    - matchers:
        - severity = critical
      receiver: alerts
      continue: false

receivers:
  - name: ops
    telegram_configs:
      - bot_token: <telegram_bot_token>
        chat_id: <telegram_chat_id>
        parse_mode: ''
        message: |-
          {{ range .Alerts -}}
          [{{ .Labels.severity | toUpper }}] {{ .Annotations.summary }}
          {{ .Annotations.description }}

          {{ end }}

  - name: alerts
    telegram_configs:
      - bot_token: <telegram_bot_token>
        chat_id: <telegram_chat_id_alerts>
        parse_mode: ''
        message: |-
          {{ range .Alerts -}}
          [KRİTİK] {{ .Annotations.summary }}
          {{ .Annotations.description }}

          {{ end }}

inhibit_rules:
  - source_matchers:
      - alertname = NodeDown
    target_matchers:
      - severity = warning
    equal: ['instance']
