# teqlif Disaster Recovery nginx — node2 (aktif sadece node1 çöküşünde)
# uploads.teqlif.com KASITLI OLARAK DIŞINDA — MinIO node1'de, node1 çöküşünde erişilemez.

upstream teqlif_dr_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# teqlif.com + www — DR frontend + API proxy
server {
    listen 443 ssl;
    server_name teqlif.com www.teqlif.com;

    ssl_certificate     /etc/ssl/teqlif/cf-origin.crt;
    ssl_certificate_key /etc/ssl/teqlif/cf-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 60m;
    limit_conn conn_limit 100;

    root  /var/www/teqlif.com/frontend;
    index app-landing.html;

    location ~ /\. { deny all; }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/messages/ws {
        proxy_pass         http://teqlif_dr_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        limit_conn conn_limit 20;
    }

    location /api/ {
        proxy_pass         http://teqlif_dr_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
        limit_req zone=api_limit burst=60 nodelay;
    }

    location = /ads.txt    { proxy_pass http://teqlif_dr_app; proxy_set_header Host $host; }
    location = /robots.txt { proxy_pass http://teqlif_dr_app; proxy_set_header Host $host; }

    location ~ ^/ilan(/|$)   { try_files /ilan.html   =404; }
    location ~ ^/profil(/|$) { try_files /profil.html =404; }
    location ~ ^/yayin(/|$)  { try_files /yayin.html  =404; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

# api.teqlif.com — DR API only
server {
    listen 443 ssl;
    server_name api.teqlif.com;

    ssl_certificate     /etc/ssl/teqlif/cf-origin.crt;
    ssl_certificate_key /etc/ssl/teqlif/cf-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 60m;
    limit_conn conn_limit 100;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    300s;

    location = / { return 302 https://teqlif.com; }

    location /api/messages/ws {
        proxy_pass http://teqlif_dr_app;
        proxy_read_timeout 3600s;
        limit_conn conn_limit 20;
    }

    location / {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://teqlif_dr_app;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name teqlif.com www.teqlif.com api.teqlif.com;
    return 301 https://$host$request_uri;
}
