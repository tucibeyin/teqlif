# teqlif node2 Rehydrate — WireGuard internal file server
# node1 backend, node2'deki backup kayıtlarını on-demand çekmek için kullanır.
# YALNIZCA WireGuard ağından (10.10.0.0/24) erişilebilir; dış dünyaya kapalı.

server {
    listen 10.10.0.2:9200;
    server_name _;

    root    /project/teqlif/backups/minio;
    autoindex off;

    # Sadece WireGuard iç ağından erişim
    allow 10.10.0.0/24;
    deny  all;

    location / {
        limit_except GET HEAD { deny all; }

        sendfile   on;
        tcp_nopush on;

        types {
            video/mp4   mp4;
            video/webm  webm;
            video/x-m4v m4v;
        }
        default_type application/octet-stream;

        add_header Cache-Control "no-store";
        add_header X-Node        "node2-rehydrate";
    }

    access_log /var/log/nginx/teqlif-rehydrate-access.log;
    error_log  /var/log/nginx/teqlif-rehydrate-error.log warn;
}
