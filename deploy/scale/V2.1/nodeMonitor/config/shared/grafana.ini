[server]
http_addr = 10.10.0.99
http_port = 3000
domain = 10.10.0.99

[paths]
data = /opt/monitor/shared/grafana/data
logs = /opt/monitor/shared/grafana/data/logs
plugins = /opt/monitor/shared/grafana/data/plugins
provisioning = /var/www/teqlif.com/deploy/scale/V2.1/nodeMonitor/config/shared/grafana-provisioning

[security]
admin_user = admin
admin_password = __GRAFANA_ADMIN_PASSWORD__
disable_gravatar = true

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
