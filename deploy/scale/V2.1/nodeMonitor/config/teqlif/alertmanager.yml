global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'node']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: telegram

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: __TELEGRAM_BOT_TOKEN__
        chat_id: __TELEGRAM_CHAT_ID__
        message: |
          {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} *{{ .CommonLabels.alertname }}*
          {{ range .Alerts }}
          Node: `{{ .Labels.node }}` ({{ .Labels.role }})
          {{ .Annotations.description }}
          {{ end }}
        parse_mode: Markdown

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ['node']
