groups:
  - name: node_health
    interval: 30s
    rules:
      - alert: NodeDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }} erişilemiyor"
          description: "{{ $labels.node }} ({{ $labels.role }}) 2 dakikadır scrape edilemiyor."

      - alert: HighCPU
        expr: 100 - (avg by(node) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} CPU yüksek"
          description: "{{ $labels.node }} CPU kullanımı %{{ $value | printf \"%.1f\" }}"

      - alert: HighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} RAM yüksek"
          description: "{{ $labels.node }} RAM kullanımı %{{ $value | printf \"%.1f\" }}"

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs"} / node_filesystem_size_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} disk doluyor"
          description: "{{ $labels.node }} {{ $labels.mountpoint }} disk kullanımı %{{ $value | printf \"%.1f\" }}"

  # ── node101 offsite backup izleme ─────────────────────────────────────
  - name: node101_offsite
    interval: 60s
    rules:
      # node101 SSD küçük (10 GB) — genel DiskSpaceLow %85'ten daha erken uyar
      - alert: Node101RootDiskWarning
        expr: (1 - (node_filesystem_avail_bytes{node="node101", mountpoint="/"} / node_filesystem_size_bytes{node="node101", mountpoint="/"})) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "node101 SSD doluyor (%{{ $value | printf \"%.1f\" }})"
          description: "node101 root disk (10 GB SSD) %{{ $value | printf \"%.1f\" }} dolu. Journal/log büyümesini kontrol et."

      - alert: Node101RootDiskCritical
        expr: (1 - (node_filesystem_avail_bytes{node="node101", mountpoint="/"} / node_filesystem_size_bytes{node="node101", mountpoint="/"})) * 100 > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "node101 SSD kritik (%{{ $value | printf \"%.1f\" }})"
          description: "node101 root disk %{{ $value | printf \"%.1f\" }} dolu — acil müdahale gerekiyor."

      # restic-rest-server down olursa backup alınamaz
      - alert: Node101ResticServerDown
        expr: up{node="node101"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "node101 erişilemiyor — offsite backup durdu"
          description: "node101 (restic REST server) 5 dakikadır scrape edilemiyor. Backup alınamıyor."

  # ── SRE-116: Uygulama katmanı alert kuralları ──────────────────────────
  - name: app_health
    interval: 30s
    rules:
      - alert: PgBouncerPoolExhausted
        expr: pgbouncer_pools_sv_idle_count == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PgBouncer havuzu tükendi"
          description: "PgBouncer {{ $labels.database }}/{{ $labels.user }} havuzunda boş bağlantı yok — yeni sorgular bloke olabilir."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis bellek kullanımı yüksek"
          description: "Redis bellek kullanımı %{{ $value | printf \"%.1f\" }} — maxmemory eşiğine yaklaşılıyor, eviction başlayabilir."

      - alert: Http5xxRateHigh
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (env)
          /
          sum(rate(http_requests_total[5m])) by (env)
          * 100 > 5
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.env }} HTTP 5xx oranı yüksek"
          description: "{{ $labels.env }} ortamında 5xx hata oranı %{{ $value | printf \"%.1f\" }} — anlık API arızası olabilir."

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 180
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL bağlantı sayısı yüksek"
          description: "PostgreSQL aktif bağlantı sayısı {{ $value }} — max_connections limitine yaklaşılıyor."

      - alert: PostgresReplicationLag
        expr: pg_replication_lag_seconds > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL replikasyon gecikmesi"
          description: "Replikasyon gecikmesi {{ $value }}s — replica güncel değil."
