global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    project: teqlif

rule_files:
  - /var/www/teqlif.com/deploy/scale/V2.1/nodeMonitor/config/teqlif/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: 'node1'
    static_configs:
      - targets: ['10.10.0.1:9100']
        labels: { node: node1, role: core }

  - job_name: 'node2'
    static_configs:
      - targets: ['10.10.0.2:9100']
        labels: { node: node2, role: backup }

  - job_name: 'node3'
    static_configs:
      - targets: ['10.10.0.3:9100']
        labels: { node: node3, role: livekit }

  - job_name: 'node4'
    static_configs:
      - targets: ['10.10.0.4:9100']
        labels: { node: node4, role: livekit }

  - job_name: 'node5'
    static_configs:
      - targets: ['10.10.0.5:9100']
        labels: { node: node5, role: staging }

  - job_name: 'node6'
    static_configs:
      - targets: ['10.10.0.6:9100']
        labels: { node: node6, role: ai }

  - job_name: 'nodeMonitor'
    static_configs:
      - targets: ['10.10.0.99:9100']
        labels: { node: nodeMonitor, role: monitor }

  - job_name: 'node101'
    static_configs:
      - targets: ['10.10.0.101:9100']
        labels: { node: node101, role: offsite-backup }

  # ── SRE-116: Uygulama katmanı metrikleri ──────────────────────────────

  - job_name: 'postgres'
    static_configs:
      - targets: ['10.10.0.1:9187']
        labels: { node: node1, component: postgres }

  - job_name: 'redis'
    static_configs:
      - targets: ['10.10.0.1:9121']
        labels: { node: node1, component: redis }

  - job_name: 'pgbouncer'
    static_configs:
      - targets: ['10.10.0.1:9127']
        labels: { node: node1, component: pgbouncer }

  - job_name: 'fastapi'
    metrics_path: /metrics
    static_configs:
      - targets: ['10.10.0.1:9182']
        labels: { node: node1, env: prod }
      - targets: ['10.10.0.5:8000']
        labels: { node: node5, env: staging }

  # ── BIZ-04-B: Eksik servis scrape hedefleri ───────────────────────────

  - job_name: 'rest-server'
    # restic REST server liveness — ayrı job: node up ≠ restic-rest-server up
    metrics_path: /metrics
    static_configs:
      - targets: ['10.10.0.101:8000']
        labels: { node: node101, component: rest-server }

  - job_name: 'clickhouse'
    static_configs:
      - targets: ['10.10.0.2:9363']
        labels: { node: node2, component: clickhouse }

  - job_name: 'minio'
    # MinIO cluster metrikleri — bearer token: /project/teqlif/config/minio_metrics_token
    # Token oluşturma: mc admin prometheus generate <alias> cluster (node2'de çalıştır)
    metrics_path: /minio/v2/metrics/cluster
    authorization:
      credentials_file: /project/teqlif/config/minio_metrics_token
    static_configs:
      - targets: ['10.10.0.1:9000']
        labels: { node: node1, component: minio }

  - job_name: 'redis-replica'
    # node2'deki Redis replika — node2'de prometheus-redis-exporter çalışmalı
    # Kurulum: deploy/scale/V2.1/node2/resources/setup_exporters.sh
    static_configs:
      - targets: ['10.10.0.2:9121']
        labels: { node: node2, component: redis-replica }

  - job_name: 'stalwart'
    # Stalwart mail server admin HTTP (10.10.0.2:8080) — /metrics v0.6+ destekli
    metrics_path: /metrics
    static_configs:
      - targets: ['10.10.0.2:8080']
        labels: { node: node2, component: stalwart }
