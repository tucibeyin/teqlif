# teqlif küme geneli yapılandırma — single source of truth
# Agent her cycle'da (60s) yeniden okur; restart gerekmez.
# Backend: backend/app/cluster_loader.py üzerinden erişir.

recording:
  enabled: true

  # Servis adı → MinIO hedefi eşlemesi
  # Agent kendi servis adını keşfeder, buradan config'ini çeker.
  services:
    teqlif-livekit:
      livekit_ws_url:   ws://127.0.0.1:7880
      minio_host:       10.10.0.1:9000
      minio_endpoint:   http://10.10.0.1:9000
      minio_bucket:     teqlif
      minio_alias:      teqlif-prod
      raw_dir:          /var/recordings/raw
      encoded_dir:      /var/recordings/encoded
      redis_url_env:    CORE_REDIS_URL

    teqlif-livekit-staging:
      livekit_ws_url:   ws://127.0.0.1:7890
      minio_host:       127.0.0.1:9100
      minio_endpoint:   http://127.0.0.1:9100
      minio_bucket:     teqlif-staging
      minio_alias:      teqlif-staging
      raw_dir:          /var/recordings/raw
      encoded_dir:      /var/recordings/encoded
      pg_dsn_env:       PG_DSN_STAGING
      redis_url_env:    STAGING_REDIS_URL

  # Transfer penceresi (UTC) — MAINT-02 fix (K3)
  # normal: 04:00–05:00 UTC | disk_warn: 03:00–05:00 UTC | emergency: pencere yok
  # minio_backup 05:30 başlamadan önce biter; notify 05:45'te güvenle çalışır
  transfer_window_start_utc: 3
  transfer_window_end_utc:   5

  # Disk guard eşikleri (GB)
  disk_warn_gb:      15   # → effective_start = start_utc (03:00) erken tetik
  disk_emergency_gb: 10   # → transfer anında başlar (pencere yok)

  # Kullanıcı erişim süresi
  user_access_hours: 24

  # Backup'tan sonra silinme süresi — K3: 30g (PRO upsell T+14 + 16g pay)
  retention_days: 30

  # MinIO bucket lifecycle (gün) — 24h kullanıcı + 1 gün backup toleransı
  # Prod node1 MinIO ILM bu değere göre ayarlanmıştır (setup_minio_ilm.sh)
  minio_expiry_days: 2
