# live2.teqlif.com — LiveKit prod (node3, DNS Only, Let's Encrypt)
server {
    listen 443 ssl;
    server_name live2.teqlif.com;

    ssl_certificate     /etc/letsencrypt/live/live2.teqlif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live2.teqlif.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=15768000" always;

    client_max_body_size 0;
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;

    proxy_connect_timeout 10s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;

    location / {
        proxy_pass http://127.0.0.1:7880;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name live2.teqlif.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
