global
    log /dev/log local0
    daemon
    user haproxy
    group haproxy

defaults
    mode tcp
    log global
    timeout connect 2s
    timeout client  30s
    timeout server  30s
    option tcp-check

listen redis-ha
    bind 127.0.0.1:6379
    balance first
    option tcp-check
    tcp-check send AUTH\ <core_redis_pass>\r\n
    tcp-check expect string +OK
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    server node1-redis 10.10.0.1:6379 check inter 2s fall 3 rise 2
    server node2-redis 10.10.0.2:6379 check inter 2s fall 3 rise 2 backup

listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
