port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  use_external_ip: true

turn:
  enabled: true
  domain: stream4.teqlif.com
  tls_port: 5349
  udp_port: 3478
  relay_range_start: 50000
  relay_range_end: 60000
  cert_file: /project/teqlif/config/ssl/stream4.teqlif.com-fullchain.pem
  key_file:  /project/teqlif/config/ssl/stream4.teqlif.com-privkey.pem

# Node1 Redis — WireGuard üzerinden doğrudan bağlantı (redis_failover.sh HA yönetir)
redis:
  address: 10.10.0.1:6379
  db: 1
  password: <core_redis_pass>

keys:
  <livekit_api_key>: <livekit_api_secret>

room:
  empty_timeout: 300
  departure_timeout: 20

webhook:
  urls:
    - https://www.teqlif.com/api/webhooks/livekit
  api_key: <livekit_api_key>

logging:
  level: info
  json: true
