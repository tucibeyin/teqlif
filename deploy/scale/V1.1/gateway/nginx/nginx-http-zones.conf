# /etc/nginx/conf.d/http-zones.conf — gateway
# Scale V1.1: microcaching zone eklendi

limit_req_zone $binary_remote_addr zone=general:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m     rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m      rate=1800r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_req_status 429;

# Microcache zone — public GET yanıtları için 5 saniyelik buffer
# Authenticated istekler (Authorization header) cache'e alınmaz
proxy_cache_path /var/cache/nginx/teqlif
    levels=1:2
    keys_zone=teqlif_cache:10m
    max_size=256m
    inactive=60s
    use_temp_path=off;
