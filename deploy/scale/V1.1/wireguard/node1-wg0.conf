# /etc/wireguard/wg0.conf — node1 (135.125.175.223)
# Scale V1.0: node1 ↔ gateway WireGuard tüneli
#
# Kurulum:
#   wg genkey | tee node1_private.key | wg pubkey > node1_public.key
#   wg genkey | tee gateway_private.key | wg pubkey > gateway_public.key
#
# Bu dosyaya node1_private.key ve gateway_public.key yaz.

[Interface]
Address = 10.10.0.1/24
ListenPort = 51820
PrivateKey = <NODE1_PRIVATE_KEY>

# Başlangıçta UFW kuralı ekle
PostUp   = ufw allow 51820/udp
PostDown = ufw delete allow 51820/udp

[Peer]
PublicKey = <GATEWAY_PUBLIC_KEY>
AllowedIPs = 10.10.0.2/32
# PersistentKeepalive node1 tarafında gerekmez; gateway başlatır
