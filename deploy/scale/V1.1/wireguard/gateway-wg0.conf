# /etc/wireguard/wg0.conf — gateway (Netcup)
# Scale V1.0: gateway ↔ node1 WireGuard tüneli
#
# Bu dosyaya gateway_private.key ve node1_public.key yaz.

[Interface]
Address = 10.10.0.2/24
ListenPort = 51820
PrivateKey = <GATEWAY_PRIVATE_KEY>

[Peer]
PublicKey = <NODE1_PUBLIC_KEY>
AllowedIPs = 10.10.0.1/32
Endpoint = 135.125.175.223:51820
PersistentKeepalive = 25
